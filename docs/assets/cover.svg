<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Trazio Asistente Reunión — Conserva la conversación. El registro es tuyo.</title>
  <desc id="description">Una portada editorial en tinta medianoche y cobalto eléctrico. Dos señales de audio independientes fluyen hacia una transcripción revisada por personas. Inferencia local, historial cifrado y revisión por fuente son los tres pilares. Ilustración abstracta, no una captura de la aplicación.</desc>
