  </g>
  <rect x="68" y="377" width="73" height="5" fill="#FFA971"/>
  <g font-family="'Segoe UI', sans-serif">
    <text x="67" y="447" fill="#F3EFE6" font-size="32" font-weight="600">Conserva la conversación.</text>
    <text x="67" y="491" fill="#86F4DC" font-size="32" font-weight="600">El registro es tuyo.</text>
    <text x="68" y="542" fill="#A6B7D1" font-size="18">Dos fuentes. Un historial revisable.</text>
    <text x="68" y="572" fill="#A6B7D1" font-size="18">Tus palabras permanecen en tu equipo.</text>
  </g>
